# Stage designs and dollar caps, RECOMPUTED AT GATE 1 from pilot-measured
# $/call. The pilot priced the textbook core-6 designs at ~$530 — far over
# the $300 ceiling — so the committed protocol below is the degradation
# path applied with real numbers: qwen3-235b-thinking and glm-5 drop to
# budget-contingent extras; claude-haiku-4.5 (fast, $0.046/call) joins the
# core; o4-mini runs a slimmed design. C2's k=16 requirement survives at
# the frontier level for every core model.
#
# Focus semantics: focus_from names a JSON file {model: {center_level_idx}}.
# In a focus stage, `k` applies at center +/- window_width (-1 = everywhere),
# focus_k ADDS samples at center +/- focus_width, c2_k ADDS at the center.

[stages.pilot-sat]
grid = "sat-n20-pilot"
set_name = "pilot"
models = ["openai/gpt-oss-20b", "openai/gpt-oss-120b", "minimax/minimax-m2.5",
          "deepseek/deepseek-r1-0528", "qwen/qwen3-235b-a22b-thinking-2507", "z-ai/glm-5"]
n_instances = 4
k = 2
cap_usd = 15.0   # total incl. the ~$7 spent before haiku/o4-mini were excluded

[stages.pilot-dag]
grid = "dag-pilot"
set_name = "pilot"
models = "all"
n_instances = 4
k = 2
cap_usd = 4.0

