[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drc"
version = "2.0.0"
description = "A small, registered MiniMax confidence study"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Newman" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
drc = "drc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["drc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
